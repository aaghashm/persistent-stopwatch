<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- crown button and stem -->
  <rect x="54" y="8" width="20" height="10" rx="3" fill="#4d4d4d"/>
  <rect x="60" y="16" width="8" height="12" fill="#4d4d4d"/>
  <!-- side button, rotated toward two o'clock -->
  <g transform="rotate(38 64 74)">
    <rect x="60" y="20" width="8" height="12" fill="#4d4d4d"/>
  </g>
  <!-- case and face -->
  <circle cx="64" cy="74" r="46" fill="#4d4d4d"/>
  <circle cx="64" cy="74" r="38" fill="#fcfcfc"/>
  <!-- quarter-hour tick marks -->
  <rect x="62" y="40" width="4" height="8" fill="#4d4d4d"/>
  <rect x="62" y="100" width="4" height="8" fill="#4d4d4d"/>
  <rect x="30" y="72" width="8" height="4" fill="#4d4d4d"/>
  <rect x="90" y="72" width="8" height="4" fill="#4d4d4d"/>
  <!-- hand pointing toward two o'clock -->
  <g transform="rotate(60 64 74)">
    <rect x="62" y="44" width="4" height="34" rx="2" fill="#3daee9"/>
  </g>
  <circle cx="64" cy="74" r="5" fill="#3daee9"/>
</svg>
