name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Fedora has current Qt 6 and KDE Frameworks 6 packages; Ubuntu LTS does not.
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-kconfig-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kdbusaddons-devel kf6-kwindowsystem-devel \
            appstream

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git reuse appstream desktop-file-utils clang-tools-extra

      - uses: actions/checkout@v4

      - name: REUSE compliance
        run: reuse lint

      - name: Desktop file
        run: desktop-file-validate io.github.aaghashm.persistentstopwatch.desktop

      - name: AppStream metadata
        run: appstreamcli validate --no-net --pedantic io.github.aaghashm.persistentstopwatch.metainfo.xml

      - name: Formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h autotests/*.cpp
