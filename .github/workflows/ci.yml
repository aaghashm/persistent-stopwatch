name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Fedora has current Qt 6 and KDE Frameworks 6 packages; Ubuntu LTS does not.
    container: fedora:latest
    steps:
      - name: Install dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git cmake ninja-build gcc-c++ extra-cmake-modules \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kirigami-devel kf6-kconfig-devel kf6-ki18n-devel kf6-kcoreaddons-devel \
            kf6-kcrash-devel kf6-kdbusaddons-devel kf6-kwindowsystem-devel \
            appstream

      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: qmllint
        run: cmake --build build --target all_qmllint

      - name: Open the window
        # Unit tests don't load the QML. Run the real app for a few seconds
        # and fail on any QML error, e.g. a binding to something missing.
        run: |
          dnf install -y --setopt=install_weak_deps=False kf6-qqc2-desktop-style
          QT_QPA_PLATFORM=offscreen timeout 5 build/bin/persistent-stopwatch > launch.log 2>&1 || test $? -eq 124
          cat launch.log
          ! grep -E "qrc:|TypeError|ReferenceError|is not installed" launch.log

  lint:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git reuse appstream desktop-file-utils clang-tools-extra ShellCheck

      - uses: actions/checkout@v7

      - name: REUSE compliance
        run: reuse lint

      - name: Desktop file
        run: desktop-file-validate io.github.aaghashm.persistentstopwatch.desktop

      - name: AppStream metadata
        run: appstreamcli validate --no-net --pedantic io.github.aaghashm.persistentstopwatch.metainfo.xml

      - name: Formatting
        run: clang-format --dry-run --Werror src/*.cpp src/*.h autotests/*.cpp

      - name: Shell scripts
        run: shellcheck docs/install.sh src/Messages.sh completions/persistent-stopwatch.bash

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf install -y --setopt=install_weak_deps=False git rpm-build rpmlint dnf-plugins-core

      - uses: actions/checkout@v7

      - name: Build the RPM from this commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(sed -n 's/^Version: *//p' packaging/persistent-stopwatch.spec)
          mkdir -p ~/rpmbuild/SOURCES
          git archive --prefix=persistent-stopwatch-$version/ -o ~/rpmbuild/SOURCES/persistent-stopwatch-$version.tar.gz HEAD
          dnf builddep -y packaging/persistent-stopwatch.spec
          rpmbuild -ba packaging/persistent-stopwatch.spec

      - name: rpmlint
        run: rpmlint -r packaging/persistent-stopwatch.rpmlintrc packaging/persistent-stopwatch.spec ~/rpmbuild/SRPMS/*.rpm ~/rpmbuild/RPMS/*/persistent-stopwatch-[0-9]*.rpm

      - name: Install it with install.sh and run it
        run: |
          mkdir /tmp/release
          cp ~/rpmbuild/RPMS/*/persistent-stopwatch-[0-9]*.rpm /tmp/release/persistent-stopwatch.$(uname -m).rpm
          PERSISTENT_STOPWATCH_DOWNLOADS=file:///tmp/release sh docs/install.sh
          persistent-stopwatch --reset --start --status
          persistent-stopwatch --pause --status

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: |
            ~/rpmbuild/RPMS/*/persistent-stopwatch-[0-9]*.rpm
            ~/rpmbuild/SRPMS/*.rpm

  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build g++ \
            extra-cmake-modules dpkg-dev file qt6-base-dev qt6-declarative-dev \
            libkirigami-dev qml6-module-org-kde-kirigami qml6-module-org-kde-coreaddons \
            libkf6config-dev libkf6coreaddons-dev libkf6crash-dev libkf6dbusaddons-dev \
            libkf6i18n-dev libkf6windowsystem-dev

      - uses: actions/checkout@v7

      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack -G DEB

      - name: Install it with install.sh and run it
        run: |
          apt-get install -y --no-install-recommends curl
          mkdir /tmp/release
          cp build/persistent-stopwatch_*.deb /tmp/release/persistent-stopwatch_$(dpkg --print-architecture).deb
          PERSISTENT_STOPWATCH_DOWNLOADS=file:///tmp/release sh docs/install.sh
          persistent-stopwatch --reset --start --status
          persistent-stopwatch --pause --status

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: build/persistent-stopwatch_*.deb
